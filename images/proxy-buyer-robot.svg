<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="0.5" stop-color="#c6ccd5"/>
      <stop offset="1" stop-color="#969db0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8ecb6"/>
      <stop offset="0.5" stop-color="#e4c561"/>
      <stop offset="1" stop-color="#c19626"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="leftHalf"><rect x="0" y="0" width="600" height="600"/></clipPath>
    <clipPath id="rightHalf"><rect x="600" y="0" width="600" height="600"/></clipPath>
    <g id="bot">
      <rect x="594" y="126" width="12" height="30" rx="6"/>
      <rect x="505" y="152" width="190" height="150" rx="28"/>
      <rect x="582" y="300" width="36" height="18" rx="6"/>
      <rect x="495" y="315" width="210" height="195" rx="30"/>
      <rect x="454" y="332" width="30" height="142" rx="15"/>
      <rect x="716" y="332" width="30" height="142" rx="15"/>
      <rect x="536" y="508" width="128" height="34" rx="14"/>
    </g>
  </defs>

  <rect width="1200" height="600" fill="#FAF8F5"/>
  <ellipse cx="600" cy="330" rx="300" ry="270" fill="url(#halo)"/>
  <ellipse cx="600" cy="548" rx="132" ry="16" fill="#1f2430" opacity="0.07"/>

  <!-- headline -->
  <text x="600" y="58" text-anchor="middle" font-size="50" font-weight="700" fill="#1f2430" letter-spacing="0.4">The Proxy Buyer</text>
  <line x1="512" y1="80" x2="688" y2="80" stroke="#c6ccd5" stroke-width="2"/>

  <!-- robot, split down the middle -->
  <use href="#bot" fill="url(#silver)" clip-path="url(#leftHalf)"/>
  <use href="#bot" fill="url(#gold)" clip-path="url(#rightHalf)"/>

  <!-- center seam -->
  <line x1="600" y1="156" x2="600" y2="300" stroke="#7f8794" stroke-width="2" opacity="0.45"/>
  <line x1="600" y1="318" x2="600" y2="508" stroke="#9c8a3e" stroke-width="2" opacity="0.4"/>

  <!-- antenna tip -->
  <circle cx="600" cy="116" r="11" fill="#2f3440"/>
  <circle cx="600" cy="116" r="4" fill="#eef1f5"/>

  <!-- visor + eyes (left eye silver, right eye gold) -->
  <rect x="535" y="196" width="130" height="58" rx="16" fill="#20242e"/>
  <circle cx="575" cy="225" r="12" fill="#d3dae3"/>
  <circle cx="625" cy="225" r="12" fill="#f0d98a"/>

  <!-- chest "shortlist" panel bridging both halves -->
  <rect x="546" y="352" width="108" height="122" rx="12" fill="#ffffff" fill-opacity="0.9" stroke="#3a3f4a" stroke-width="2"/>
  <g stroke-linecap="round">
    <path d="M563 378 l6 6 l11 -13" fill="none" stroke="#2f3440" stroke-width="3"/>
    <line x1="588" y1="378" x2="638" y2="378" stroke="#6b7280" stroke-width="4"/>
    <path d="M563 400 l6 6 l11 -13" fill="none" stroke="#2f3440" stroke-width="3"/>
    <line x1="588" y1="400" x2="638" y2="400" stroke="#6b7280" stroke-width="4"/>
    <circle cx="567" cy="424" r="4" fill="#c3c8d0"/>
    <line x1="588" y1="424" x2="638" y2="424" stroke="#c3c8d0" stroke-width="4"/>
    <circle cx="567" cy="448" r="4" fill="#c3c8d0"/>
    <line x1="588" y1="448" x2="638" y2="448" stroke="#c3c8d0" stroke-width="4"/>
  </g>

  <!-- connectors -->
  <line x1="352" y1="490" x2="450" y2="470" stroke="#b9bfc9" stroke-width="2"/>
  <circle cx="450" cy="470" r="4" fill="#969db0"/>
  <line x1="848" y1="490" x2="750" y2="470" stroke="#d9bf6a" stroke-width="2"/>
  <circle cx="750" cy="470" r="4" fill="#c19626"/>

  <!-- left text box -->
  <rect x="60" y="430" width="292" height="120" rx="16" fill="#f3f5f8" stroke="#b9bfc9" stroke-width="2"/>
  <text x="206" y="482" text-anchor="middle" font-size="23" font-weight="600" fill="#2b303b">Tasked with developing</text>
  <text x="206" y="512" text-anchor="middle" font-size="23" font-weight="600" fill="#2b303b">a shortlist</text>

  <!-- right text box -->
  <rect x="848" y="430" width="292" height="120" rx="16" fill="#fbf4dd" stroke="#d9bf6a" stroke-width="2"/>
  <text x="994" y="482" text-anchor="middle" font-size="23" font-weight="600" fill="#2b303b">Tasked with matching</text>
  <text x="994" y="512" text-anchor="middle" font-size="23" font-weight="600" fill="#2b303b">buyer requirements</text>
</svg>
